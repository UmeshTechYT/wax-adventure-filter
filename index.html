<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAX Adventure Viewer</title>
<style>
:root{
  --bg:#0b0b12;
  --panel:#141421;
  --panel2:#1b1b2b;
  --border:#2c2c42;
  --text:#f5f5ff;
  --muted:#a9a9bd;
  --accent:#8b5cf6;
  --accent2:#22d3ee;
  --gold:#fbbf24;
}
*{box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  margin:0;
  min-height:100vh;
  padding:20px;
  background:
    radial-gradient(circle at 15% 0%,rgba(139,92,246,.20),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(34,211,238,.12),transparent 25%),
    var(--bg);
  color:var(--text);
}
.box{max-width:1100px;margin:auto}
.header{text-align:center;margin-bottom:22px}
.header h1{margin:0;font-size:clamp(25px,6vw,40px)}
.header p{margin:7px 0 0;color:var(--muted)}
.controls{
  background:rgba(20,20,33,.88);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}
input,button{
  padding:12px 14px;
  font-size:16px;
  border-radius:10px;
  border:1px solid var(--border);
}
input{
  flex:1;
  min-width:150px;
  background:#0f0f19;
  color:var(--text);
}
button{
  background:linear-gradient(135deg,var(--accent),#6d28d9);
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}
button:hover{filter:brightness(1.12)}
.status{margin:12px 2px;color:var(--muted)}
.error{color:#ff6b81;margin:10px 2px}
.section{
  margin-top:18px;
  background:rgba(20,20,33,.88);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}
.section h3{margin:0 0 12px}
.card{
  background:linear-gradient(145deg,var(--panel2),#11111d);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}
.adventure-title{font-size:clamp(22px,5vw,30px);font-weight:800}
.next-adventure{margin-top:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel2)}
.next-label{font-weight:800}.next-countdown{margin-top:4px;color:var(--gold);font-size:18px;font-weight:900}.next-time{margin-top:3px;color:var(--muted);font-size:12px}

.count{color:var(--muted);margin-bottom:10px}
.top-user{
  margin-bottom:18px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}
.top-user:last-child{border-bottom:0;margin-bottom:0}
.top-name{font-size:17px;font-weight:bold}
.nfts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nft{width:110px}
.nft img{
  width:110px;height:110px;object-fit:contain;
  border-radius:12px;border:1px solid var(--border);
  background:#0d0d15;display:block;
}
.nft-name{font-size:12px;color:var(--muted);margin-top:5px;word-break:break-word}.nft-shine{font-size:11px;color:var(--gold);margin-top:3px;font-weight:700;word-break:break-word}.possible-list{display:grid;gap:10px}.possible-item{padding:10px;border:1px solid var(--border);border-radius:10px;background:#11111d}.possible-title{font-weight:800}.possible-meta{font-size:12px;color:var(--muted);margin-top:4px}.possible-bonus{color:var(--gold);font-weight:800;margin-top:5px}.mod-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.mod-pill{font-size:11px;padding:6px 9px;border:1px solid var(--border);border-radius:999px;color:var(--muted);background:#10101a}.mod-pill.covered{border-color:rgba(34,211,238,.45);color:#dffbff}.mod-pill.missing{opacity:.75}.mod-source{display:block;font-size:10px;margin-top:2px;color:var(--muted)}
.wrap{overflow-x:auto;border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{border-bottom:1px solid var(--border);padding:11px 9px;text-align:left}
th{background:#191927;color:#ddd}
td{background:#10101a}
.sort{cursor:pointer}
tbody tr:hover td{background:#181827}
@media(max-width:600px){
  body{padding:12px}
  .controls{flex-direction:column}
  input,button{width:100%;min-width:0}
  .section{padding:13px}
  .nft,.nft img{width:90px}
  .nft img{height:90px}
  th,td{padding:9px 7px;font-size:14px}
}
@media(min-width:900px){
  .nft,.nft img{width:125px}
  .nft img{height:125px}
}
</style></head>
<body><div class="box">
<div class="header"><h1>⚡ WAX Adventure</h1><p>Adventure &amp; Participant Viewer</p></div>
<div class="controls"><input id="id" type="number" value="1198" placeholder="Adventure ID">
<button onclick="load()">Load Adventure</button>
<button onclick="loadLatest()">🔄 Latest Adventure</button></div>
<div id="status" class="status"></div><div id="error" class="error"></div>
<div class="section"><h3>🗂️ Adventure</h3><div id="adv" class="card">Enter an ID and press Load.</div><div id="nextAdventure" class="next-adventure"><div class="next-label">⏭️ Next Adventure</div><div class="next-time">Enter an ID and press Load.</div></div>
<div class="section"><h3>🏆 Highest Score</h3><div id="topUsers" class="card">Enter an ID and press Load.</div></div>
<div class="section"><h3>💡 Possible Best NFT</h3><div id="possible" class="card">Enter an ID and press Load.</div></div>
<div class="section"><h3>👥 Participants</h3><div id="count" class="count"></div>
<div class="wrap"><table><thead><tr><th>Rank</th><th>Wallet</th>
<th class="sort" onclick="sortScore()">Score ↕</th></tr></thead>
<tbody id="body"></tbody></table></div></div>
<script>
const API_BASE="https://wax-adventure-filter.onrender.com";
let rows=[],desc=true;
let nextCountdownTimer=null;
function formatCountdown(seconds){
 seconds=Math.max(0,Math.floor(Number(seconds)||0));
 const d=Math.floor(seconds/86400); seconds%=86400;
 const hr=Math.floor(seconds/3600); seconds%=3600;
 const min=Math.floor(seconds/60); const sec=seconds%60;
 if(d) return d+"d "+hr+"h "+min+"m "+sec+"s";
 if(hr) return hr+"h "+min+"m "+sec+"s";
 return min+"m "+sec+"s";
}
function renderNextAdventure(info){
 const box=document.getElementById("nextAdventure");
 if(nextCountdownTimer){clearInterval(nextCountdownTimer);nextCountdownTimer=null;}
 if(!info){box.innerHTML="<div class=\"next-label\">⏭️ Next Adventure</div><div class=\"next-time\">No upcoming adventure found.</div>";return;}
 const title=esc(info.title||("Adventure #"+info.adventure_id));
 const start=info.start_time ? new Date(info.start_time) : null;
 const draw=()=>{
  if(start && !isNaN(start.getTime())){
   const seconds=(start.getTime()-Date.now())/1000;
   if(seconds>0){
    box.innerHTML="<div class=\"next-label\">⏭️ Next Adventure #"+esc(info.adventure_id)+" — "+title+"</div>"+
      "<div class=\"next-countdown\">Starts in: "+formatCountdown(seconds)+"</div>"+
      "<div class=\"next-time\">"+esc(start.toLocaleString())+"</div>";
   }else{
    box.innerHTML="<div class=\"next-label\">⏭️ Next Adventure #"+esc(info.adventure_id)+" — "+title+"</div><div class=\"next-countdown\">Starting now / loading…</div>";
   }
  }else{
   box.innerHTML="<div class=\"next-label\">⏭️ Next Adventure #"+esc(info.adventure_id)+" — "+title+"</div><div class=\"next-time\">Start time not available from adventure data.</div>";
  }
 };
 draw();
 if(start && !isNaN(start.getTime())) nextCountdownTimer=setInterval(draw,1000);
}

async function loadLatest(){
 const err=document.getElementById("error");
 err.textContent="";
 document.getElementById("status").textContent="Finding latest adventure...";
 try{
  const response=await fetch(API_BASE+"/latest-adventure");
  const data=await response.json();
  if(!response.ok) throw new Error(data.error||"Could not find latest adventure.");
  document.getElementById("id").value=data.adventure_id;
  await load();
 }catch(e){
  document.getElementById("status").textContent="";
  document.getElementById("adv").textContent="";
  document.getElementById("count").textContent="";
  renderNextAdventure(null);
  err.textContent="Failed to fetch: "+e.message;
 }
}

async function load(){
 const id=document.getElementById("id").value.trim(), err=document.getElementById("error");
 err.textContent="";document.getElementById("status").textContent="Loading...";
 try{
  const [a,p,t]=await Promise.all([
   fetch(API_BASE+"/adventure?adventure_id="+encodeURIComponent(id)),
   fetch(API_BASE+"/participants?adventure_id="+encodeURIComponent(id)),
   fetch(API_BASE+"/top-users-nfts?adventure_id="+encodeURIComponent(id))
  ]);
  const ad=await a.json(), pd=await p.json(), td=await t.json();
  if(!a.ok) throw new Error(ad.error||"Adventure request failed");
  if(!p.ok) throw new Error(pd.error||"Participants request failed");
  if(!t.ok) throw new Error(td.error||"Top users request failed");
  rows=pd.rows||[];desc=true;sortScore(false);
  document.getElementById("status").textContent="Adventure "+id+" loaded";
  document.getElementById("count").textContent=pd.count+" participant(s)";
   renderTopUsers(td);
  renderPossible(td);
  if(ad.rows && ad.rows.length){
   const adventure = ad.rows[0];
   const title = adventure.title || adventure.name || "";
   document.getElementById("adv").innerHTML =
     "<h2 style=\"margin:0;\">🗂️ " + esc(title || "Adventure") + "</h2>";
  }else{
   document.getElementById("adv").textContent = "No adventure found.";
  }
  renderNextAdventure(ad.next_adventure);
 }catch(e){document.getElementById("status").textContent="";document.getElementById("adv").textContent="";
  err.textContent="Failed to fetch: "+e.message;}
}
function resolveImageUrl(image){
  if(!image) return "";
  if(image.startsWith("http://") || image.startsWith("https://")) return image;
  return API_BASE + image;
}

function renderTopUsers(data){
 const box=document.getElementById("topUsers");
 if(!data.users || !data.users.length){
  box.textContent="No highest-score user found.";
  return;
 }
 let html="<strong>Highest Score: "+esc(data.highest_score)+"</strong>";
 data.users.forEach(u=>{
  html+="<div class=\"top-user\"><div class=\"top-name\">🏆 "
    +esc(u.wallet)+" — "+esc(u.score)+"</div>";
  if(u.nfts && u.nfts.length){
   html+="<div class=\"nfts\">";
   u.nfts.forEach(n=>{
    if(n.image){
     html+="<div class=\"nft\"><img src=\""+esc(resolveImageUrl(n.image))+"\" alt=\""+esc(n.name)+"\" loading=\"lazy\" decoding=\"async\">"
       +"<div class=\"nft-name\">"+esc(n.name)+"</div>"
       +(n.shine ? "<div class=\"nft-shine\">✨ "+esc(n.shine)+"</div>" : "")
       +"</div>";
    }
   });
   html+="</div>";
  }else{
   html+="<div style=\"margin-top:6px;\">No NFT image data available.</div>";
  }
  html+="</div>";
 });
 box.innerHTML=html;
}

function renderPossible(data){
 const box=document.getElementById("possible");
 if(!data.modifiers || !data.modifiers.length){
  box.textContent="No Adventure score parameters found.";
  return;
 }
 let html="";
 const best=data.best_three || data.possible || [];
 const totalBonus=best.length ? Number(best[0].projected_score||data.highest_score||0)-Number(data.highest_score||0) : 0;
 html+="<div style=\"font-weight:800;font-size:18px;margin-bottom:8px;\">Best 3-NFT Combination</div>";
 html+="<div class=\"possible-meta\" style=\"margin-bottom:10px;\">Current 3-NFT Score: <b>"+esc(data.highest_score)+"</b>";
 if(best.length) html+=" → Best Score: <b>"+esc(best[0].projected_score)+"</b> <span style=\"color:var(--gold);font-weight:800;\">(+"+esc(totalBonus)+")</span>";
 html+="</div>";
 if(best.length){
  html+="<div class=\"possible-list\">";
  best.forEach((n,i)=>{
   html+="<div class=\"possible-item\"><div class=\"possible-title\">"+(i+1)+"️⃣ "+esc(n.name)
    +(n.shine ? " — ✨ "+esc(n.shine) : "")
    +"</div>";
   if(n.matches && n.matches.length){
    html+="<div class=\"possible-meta\">"+n.matches.map(m=>"✅ "+esc(m.type)+": "+esc(m.value)+" → +"+esc(m.bonus)).join(" · ")+"</div>";
   }
   html+="<div class=\"possible-bonus\">"+(n.kept?"Keeps this NFT":"Replace / Add this NFT")+"</div></div>";
  });
  html+="</div>";
 }else{
  html+="<div>No higher-scoring 3-NFT combination found in the collection.</div>";
 }
 html+="<div style=\"font-weight:800;font-size:16px;margin-top:18px;\">Adventure Score Modifiers</div>";
 html+="<div class=\"mod-list\">";
 data.modifiers.forEach(m=>{
  const icon=m.covered ? "✅" : "⬜";
  const names=(m.matched_nfts||[]).map(n=>n.name+(n.shine?" ("+n.shine+")":""));
  html+="<span class=\"mod-pill "+(m.covered?"covered":"missing")+" title=\""+esc(names.length?"Already covered by: "+names.join(", "):"Not found in current highest-score NFT(s)")+"\">"
    +icon+" "+esc(m.type)+": "+esc(m.value)+" → +"+esc(m.bonus)
    +(names.length?"<span class=\"mod-source\">"+esc(names.join(", "))+"</span>":"")
    +"</span>";
 });
 html+="</div>";
 box.innerHTML=html;
}
function sortScore(toggle=true){if(toggle)desc=!desc;rows.sort((a,b)=>
 (Number(b.score||0)-Number(a.score||0))*(desc?1:-1));render();}
function render(){document.getElementById("body").innerHTML=rows.map((r,i)=>
 "<tr><td>"+rankLabel(i+1)+"</td><td>"+esc(r.wallet)+"</td><td><b>"+esc(r.score)+"</b></td></tr>").join("");}
function rankLabel(rank){
 if(rank===1) return "🥇 1";
 if(rank===2) return "🥈 2";
 if(rank===3) return "🥉 3";
 return String(rank);
}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
</script></body></html>
