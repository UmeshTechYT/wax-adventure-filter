<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAX Adventure Viewer</title>
<style>
body{font-family:Arial;margin:0;padding:16px;background:#f5f5f5}.box{max-width:1000px;margin:auto;background:white;padding:16px;border-radius:12px}
input,button{padding:11px;font-size:16px;margin:4px}input{width:180px}.error{color:#b00020}.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:500px}th,td{border:1px solid #ddd;padding:8px}th{background:#eee}
.sort{cursor:pointer}.card{background:#f7f7f7;padding:12px;border-radius:8px;overflow:auto}
</style></head>
<body><div class="box">
<h2>WAX Adventure Viewer</h2>
<input id="id" type="number" value="1198" placeholder="Adventure ID">
<button onclick="load()">Load Adventure</button>
<div id="status"></div><div id="error" class="error"></div>
<h3>🗂️ Adventure</h3><div id="adv" class="card">Enter an ID and press Load.</div>
<h3>👥 Participants</h3><div id="count"></div>
<div class="wrap"><table><thead><tr><th>Rank</th><th>Wallet</th>
<th class="sort" onclick="sortScore()">Score ↕</th></tr></thead>
<tbody id="body"></tbody></table></div></div>
<script>
const API_BASE="https://wax-adventure-filter.onrender.com";
let rows=[],desc=true;
async function load(){
 const id=document.getElementById("id").value.trim(), err=document.getElementById("error");
 err.textContent="";document.getElementById("status").textContent="Loading...";
 try{
  const [a,p]=await Promise.all([
   fetch(API_BASE+"/adventure?adventure_id="+encodeURIComponent(id)),
   fetch(API_BASE+"/participants?adventure_id="+encodeURIComponent(id))
  ]);
  const ad=await a.json(), pd=await p.json();
  if(!a.ok) throw new Error(ad.error||"Adventure request failed");
  if(!p.ok) throw new Error(pd.error||"Participants request failed");
  rows=pd.rows||[];desc=true;sortScore(false);
  document.getElementById("status").textContent="Adventure "+id+" loaded";
  document.getElementById("count").textContent=pd.count+" participant(s)";
  if(ad.rows && ad.rows.length){
   const adventure = ad.rows[0];
   const title = adventure.title || adventure.name || "";
   document.getElementById("adv").innerHTML =
     "<h2 style=\"margin:0;\">🗂️ " + esc(title || "Adventure") + "</h2>";
  }else{
   document.getElementById("adv").textContent = "No adventure found.";
  }
 }catch(e){document.getElementById("status").textContent="";document.getElementById("adv").textContent="";
  err.textContent="Failed to fetch: "+e.message;}
}
function sortScore(toggle=true){if(toggle)desc=!desc;rows.sort((a,b)=>
 (Number(b.score||0)-Number(a.score||0))*(desc?1:-1));render();}
function render(){document.getElementById("body").innerHTML=rows.map((r,i)=>
 "<tr><td>"+(i+1)+"</td><td>"+esc(r.pid)+"</td><td>"+esc(r.wallet)+"</td><td><b>"+esc(r.score)+"</b></td></tr>").join("");}
function rankLabel(rank){
 if(rank===1) return "🥇 1";
 if(rank===2) return "🥈 2";
 if(rank===3) return "🥉 3";
 return String(rank);
}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
</script></body></html>
